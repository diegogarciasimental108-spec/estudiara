<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SteelMind - Inicio</title>

<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'VT323', monospace;
    overflow:hidden;
    color:white;
}

/* 🎥 VIDEO FONDO */
#fondoVideo{
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit: cover;
    z-index:-1;
}

/* 🎮 CONTENIDO */
.contenido{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}
.titulo{
     font-size:65px;
}
/* BOTÓN START */
#start{
    font-size:40px;
    cursor:pointer;
    animation: parpadeo 1s infinite;
}

/* TEXTO CARGANDO */
#cargando{
    display:none;
    font-size:35px;
}

/* ANIMACIÓN */
@keyframes parpadeo{
    0%{opacity:1;}
    50%{opacity:0;}
    100%{opacity:1;}
}

</style>
</head>

<body>

<!-- 🎥 VIDEO -->
<video autoplay muted loop id="fondoVideo">
  <source src="VIDEO/fondo.mp4" type="video/mp4">
</video>

<div class="contenido">
    <h1 class="titulo">SteelMind</h1>
    <p id="start">▶ PRESS START</p>
    <p id="cargando">⏳ Cargando...</p>
</div>

<!-- 🔊 AUDIO -->
<audio id="audioInicio" src="AUDIO/audiodelinicio.mp3"></audio>

<script>

// elementos
var start = document.getElementById("start");
var cargando = document.getElementById("cargando");
var audio = document.getElementById("audioInicio");

start.onclick = function(){

    // ocultar botón
    start.style.display = "none";

    // mostrar cargando
    cargando.style.display = "block";

    // reproducir audio
    if(audio){
        audio.volume = 0.5;
        audio.play();
    }

    // 🔥 TIEMPO LARGO (15 segundos)
    setTimeout(function(){
        window.location.href = "primera.html";
    }, 25100);

}

</script>

</body>
</html>
